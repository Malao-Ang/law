# Thai OCR POC - deployment runtime compose.
#
# Production/deploy:
#   docker compose up -d --build
#
# Development with bind mounts and Vite HMR:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  laravel-app:
    image: ${LARAVEL_IMAGE:-thai-ocr-laravel-app:local}
    build:
      context: ./apps/app-laravel
      dockerfile: Dockerfile
    container_name: thai-ocr-laravel-app
    working_dir: /var/www/html
    command: >
      sh -c "mkdir -p storage/app/poc
      && rm -f public/hot
      && php artisan optimize
      && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - PDF_SERVICE_URL=http://pdf-service:3001
    volumes:
      - poc_storage:/var/www/html/storage/app/poc
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      ocr-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      pdf-service:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:-8500}:8000"

  queue-worker:
    image: ${LARAVEL_IMAGE:-thai-ocr-laravel-app:local}
    build:
      context: ./apps/app-laravel
      dockerfile: Dockerfile
    container_name: thai-ocr-queue-worker
    working_dir: /var/www/html
    # For bulk throughput, run multiple workers:
    #   docker compose up -d --scale queue-worker=3 --no-recreate
    # Each worker processes one document concurrently; throughput scales linearly
    # up to ~3-4 workers before the GPU becomes the bottleneck.
    #
    # Vendor is baked into the image, so no vendor-install handshake is needed;
    # depends_on laravel-app (service_healthy) gates startup instead.
    command: >
      sh -c "php artisan queue:work --tries=2 --backoff=10 --timeout=1800"
    restart: unless-stopped
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - QUEUE_CONNECTION=redis
      - PDF_SERVICE_URL=http://pdf-service:3001
    volumes:
      - poc_storage:/var/www/html/storage/app/poc
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      laravel-app:
        condition: service_healthy
      ocr-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      pdf-service:
        condition: service_started

  ocr-service:
    image: ${OCR_IMAGE:-thai-ocr-service:local}
    build:
      context: ./apps/ocr-service
      # GPU (recommended when NVIDIA driver + nvidia-container-toolkit are present):
      #   dockerfile: Dockerfile.gpu
      # CPU fallback:
      dockerfile: Dockerfile.simple
    container_name: thai-ocr-service
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    volumes:
      - poc_storage:/data/poc
    env_file:
      - .env
    ports:
      - "${OCR_HOST_PORT:-8010}:8010"
    user: "0:0"  # Run as root to handle volume permissions
    # Uncomment the deploy block below when using Dockerfile.gpu.
    # Requires nvidia-container-toolkit installed in WSL2:
    #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  pdf-service:
    image: ${PDF_IMAGE:-thai-ocr-pdf-service:local}
    build:
      context: ./apps/pdf-service
    container_name: thai-ocr-pdf-service
    restart: unless-stopped
    ports:
      - "${PDF_HOST_PORT:-3001}:3001"

  redis:
    image: redis:7-alpine
    container_name: thai-ocr-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: thai-ocr-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTIC_HOST_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: thai-ocr-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: poc
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - poc_mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" || mongo --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  poc_storage:
  es_data:
  poc_mongo:
