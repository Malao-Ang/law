# Thai OCR POC - Optimized for faster builds
# For best performance, run with BuildKit enabled:
#   export DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1
#   docker-compose build

services:
  laravel-app:
    build:
      context: ./apps/app-laravel
      dockerfile: Dockerfile
    container_name: thai-ocr-laravel-app
    working_dir: /var/www/html
    # Sentinel: delete .vendor_ready before boot, recreate after.
    # queue-worker waits for this file so it never starts with a partial vendor.
    # Composer dependencies are baked into the image / vendor volume; do not
    # rerun composer install on every start against an unstable bind mount.
    command: >
      sh -c "git config --global --add safe.directory '*'
      && mkdir -p storage/app/poc
      && rm -f storage/app/poc/.vendor_ready storage/app/poc/vite.hot
      && test -f vendor/autoload.php
      && php artisan config:clear
      && touch storage/app/poc/.vendor_ready
      && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - PDF_SERVICE_URL=http://pdf-service:3001
    volumes:
      - ./apps/app-laravel:/var/www/html
      - poc_storage:/var/www/html/storage/app/poc
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      ocr-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      pdf-service:
        condition: service_started
    ports:
      - "8000:8000"

  laravel-vite:
    image: node:20-bookworm-slim
    container_name: thai-ocr-laravel-vite
    working_dir: /var/www/html
    command: >
      sh -c "test -x node_modules/.bin/vite
      || { echo 'Missing apps/app-laravel/node_modules/.bin/vite. Run: cd apps/app-laravel && npm install'; exit 1; }
      && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - PORT=5173
      - HMR_PORT=5173
      - HMR_HOST=localhost
      - CHOKIDAR_USEPOLLING=true
      - VITE_CACHE_DIR=/tmp/app-laravel-vite-cache
    volumes:
      - ./apps/app-laravel:/var/www/html
      - /tmp/app-laravel-vite-cache:/tmp/app-laravel-vite-cache
    ports:
      - "5173:5173"
    depends_on:
      - laravel-app

  queue-worker:
    build:
      context: ./apps/app-laravel
      dockerfile: Dockerfile
    container_name: thai-ocr-queue-worker
    working_dir: /var/www/html
    # For bulk throughput, run multiple workers:
    #   docker compose up -d --scale queue-worker=3 --no-recreate
    # Each worker processes one document concurrently; throughput scales linearly
    # up to ~3-4 workers before the GPU becomes the bottleneck.
    #
    # Waits for storage/app/poc/.vendor_ready written by laravel-app after boot
    # completes — prevents starting before the app is ready.
    command: >
      sh -c "git config --global --add safe.directory '*'
      && echo 'Waiting for vendor install to complete...'
      && until [ -f storage/app/poc/.vendor_ready ]; do sleep 2; done
      && php artisan queue:work --tries=2 --backoff=10 --timeout=1800"
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - QUEUE_CONNECTION=redis
      - PDF_SERVICE_URL=http://pdf-service:3001
    volumes:
      - ./apps/app-laravel:/var/www/html
      - poc_storage:/var/www/html/storage/app/poc
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      laravel-app:
        condition: service_started
      ocr-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      pdf-service:
        condition: service_started

  ocr-service:
    build:
      context: ./apps/ocr-service
      # GPU (recommended when NVIDIA driver + nvidia-container-toolkit are present):
      #   dockerfile: Dockerfile.gpu
      # CPU fallback:
      dockerfile: Dockerfile.simple
    container_name: thai-ocr-service
    working_dir: /app
    volumes:
      - ./apps/ocr-service:/app
      - poc_storage:/data/poc
    env_file:
      - .env
    ports:
      - "8010:8010"
    user: "0:0"  # Run as root to handle volume permissions
    # Uncomment the deploy block below when using Dockerfile.gpu.
    # Requires nvidia-container-toolkit installed in WSL2:
    #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  pdf-service:
    build:
      context: ./apps/pdf-service
    container_name: thai-ocr-pdf-service
    restart: unless-stopped
    ports:
      - "3001:3001"

  redis:
    image: redis:7-alpine
    container_name: thai-ocr-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: thai-ocr-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    container_name: thai-ocr-mongo
    ports:
      - "27017:27017"
    volumes:
      - poc_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  poc_storage:
  es_data:
  poc_mongo:
