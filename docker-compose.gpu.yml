# GPU override for OCR development.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml build ocr-service
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ocr-service queue-worker laravel-app laravel-vite
#
# Requirements:
#   - NVIDIA driver installed on the host / WSL2
#   - NVIDIA Container Toolkit enabled for Docker
#   - `nvidia-smi` works on the host before starting containers

services:
  ocr-service:
    build:
      context: ./apps/ocr-service
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
