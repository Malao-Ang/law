<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>MinIO Test</title>
<style>
body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
h1 { color: #333; }
.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
h2 { margin-top: 0; font-size: 1rem; color: #555; }
button { background: #1a3673; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; }
button:hover { background: #0f2050; }
input[type=file], input[type=text] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px; }
pre { background: #1e1e1e; color: #d4d4d4; padding: 14px; border-radius: 6px; overflow: auto; font-size: 13px; max-height: 300px; }
.ok { color: green; } .err { color: red; }
</style>
</head>
<body>
<h1>🗄 MinIO Test</h1>
<p style="color:#666">Base URL: <code id="baseUrl"></code></p>

<div class="card">
  <h2>1. List files (GET /api/test/minio)</h2>
  <button onclick="listFiles()">List</button>
  <pre id="listResult">-</pre>
</div>

<div class="card">
  <h2>2. Upload file (POST /api/test/minio/upload)</h2>
  <input type="file" id="uploadFile">
  <button onclick="uploadFile()">Upload</button>
  <pre id="uploadResult">-</pre>
</div>

<div class="card">
  <h2>3. Presign URL (POST /api/test/minio/presign)</h2>
  <input type="text" id="presignFilename" placeholder="e.g. doc_xxx/GcGEQx.pdf">
  <button onclick="presign()">Get URL</button>
  <pre id="presignResult">-</pre>
</div>

<script>
const base = window.location.origin;
document.getElementById('baseUrl').textContent = base;

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(base + path, opts);
  return res.json();
}

async function listFiles() {
  const el = document.getElementById('listResult');
  el.textContent = 'Loading...';
  try {
    const data = await api('GET', '/api/test/minio');
    el.className = data.error ? 'err' : 'ok';
    el.textContent = JSON.stringify(data, null, 2);
  } catch(e) { el.className = 'err'; el.textContent = e.message; }
}

async function uploadFile() {
  const file = document.getElementById('uploadFile').files[0];
  const el = document.getElementById('uploadResult');
  if (!file) { el.textContent = 'Please select a file'; return; }
  el.textContent = 'Uploading...';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const data = await api('POST', '/api/test/minio/upload', fd);
    el.className = data.error ? 'err' : 'ok';
    el.textContent = JSON.stringify(data, null, 2);
    if (data.minio_filename) {
      document.getElementById('presignFilename').value = data.minio_filename;
    }
  } catch(e) { el.className = 'err'; el.textContent = e.message; }
}

async function presign() {
  const filename = document.getElementById('presignFilename').value.trim();
  const el = document.getElementById('presignResult');
  if (!filename) { el.textContent = 'Please enter filename'; return; }
  el.textContent = 'Loading...';
  try {
    const data = await api('POST', '/api/test/minio/presign', { filename });
    el.className = data.error ? 'err' : 'ok';
    el.textContent = JSON.stringify(data, null, 2);
  } catch(e) { el.className = 'err'; el.textContent = e.message; }
}
</script>
</body>
</html>
