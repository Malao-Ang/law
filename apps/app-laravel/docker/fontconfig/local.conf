<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Thai legal DOCX/PDF exports declare "TH Sarabun PSK" / "TH Sarabun New" /
    "CordiaNew". When the genuine TTFs are bundled (docker/fonts/) fontconfig
    resolves them by name. The <default> fallbacks below make the open-licensed
    Google "Sarabun" the substitute ONLY when the real face is missing, so Thai
    never renders as tofu even if a font file is absent.
  -->
  <alias binding="weak">
    <family>TH Sarabun PSK</family>
    <default><family>Sarabun</family></default>
  </alias>
  <alias binding="weak">
    <family>TH Sarabun New</family>
    <default><family>Sarabun</family></default>
  </alias>
  <alias binding="weak">
    <family>THSarabunPSK</family>
    <default><family>Sarabun</family></default>
  </alias>
  <alias binding="weak">
    <family>CordiaNew</family>
    <default><family>Sarabun</family></default>
  </alias>
</fontconfig>
