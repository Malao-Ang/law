<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Thai legal DOCX/PDF exports declare the proprietary "TH Sarabun PSK"
    family (see DocumentExportService::setDefaultFontName). That font is not
    redistributable, so we bundle the open-licensed Google "Sarabun" face and
    alias the TH Sarabun names to it. Without this, LibreOffice substitutes a
    Latin-only fallback (DejaVu Sans) and Thai text renders as tofu boxes.
  -->
  <match target="pattern">
    <test name="family"><string>TH Sarabun PSK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarabun</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TH Sarabun New</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarabun</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>THSarabunPSK</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Sarabun</string></edit>
  </match>
</fontconfig>
