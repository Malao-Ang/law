; ponytail: revalidate_freq=60 — PHP rechecks file mtimes every 60 s instead
; of every request. Change to validate_timestamps=0 for max speed (requires
; container restart after any PHP edit, but --no-reload already means that).
opcache.enable=1
opcache.revalidate_freq=60
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
